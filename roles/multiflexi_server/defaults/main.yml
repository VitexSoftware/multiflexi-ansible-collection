---
# defaults file for multiflexi_server
multiflexi_server_database_engines:
  - sqlite
  - pgsql
  - mysql
  # - mssql

multiflexi_server_database_type: sqlite  # canonical database type, override in playbook or inventory
multiflexi_server_webserver_type: apache  # default web server type, can be overridden in playbook or inventory

# Serve MultiFlexi at / and /api instead of /multiflexi/ and /multiflexi/api/
# Enable when MultiFlexi is the only web application on the host.
multiflexi_server_exclusive_host: false

# Initial admin user. Set multiflexi_initial_admin_login to trigger creation.
# Only runs when no enabled user exists yet (idempotent).
# Leave multiflexi_initial_admin_password empty to auto-generate and print.
multiflexi_initial_admin_login: ""
multiflexi_initial_admin_email: ""        # defaults to admin@<fqdn> when empty
multiflexi_initial_admin_password: ""     # auto-generated when empty
multiflexi_initial_admin_firstname: "Admin"
multiflexi_initial_admin_lastname: ""

multiflexi_web_interface: true # Install multiflexi-web package

# Optional Zabbix integration variables
multiflexi_server_zabbix_host: null
multiflexi_server_zabbix_server: null

# Optional Node-RED integration. When enabled, installs Node-RED and the
# node-red-contrib-multiflexi nodes, wires the multiflexi-eventor catalog feed
# and shows Node-RED in the MultiFlexi web Integrations menu.
multiflexi_server_nodered_enabled: false
multiflexi_server_nodered_user: nodered
multiflexi_server_nodered_userdir: /var/lib/node-red/.node-red
# Expose the Node-RED editor through the existing HTTPS vhost under this path
# (reverse-proxied to the local node-red) instead of the unencrypted :1880 port.
# Set to "" to disable the proxy and fall back to direct :1880 access.
multiflexi_server_nodered_http_root: /node-red
# Editor URL shown in the Integrations menu (clickable by web users). By default
# the HTTPS reverse-proxied path; falls back to direct :1880 when no proxy root.
multiflexi_server_nodered_url: >-
  {{ ('https://' ~ ansible_fqdn ~ multiflexi_server_nodered_http_root ~ '/')
     if (multiflexi_server_nodered_http_root | length > 0)
     else ('http://' ~ ansible_fqdn ~ ':1880/') }}
# Catalog node HTTP-in path + the URL the event processor pushes the catalog to.
# The catalog receiver stays on the local port (httpNodeRoot is left at '/'),
# so the push path is unaffected by the editor reverse proxy.
multiflexi_server_nodered_catalog_path: /multiflexi-catalog
multiflexi_server_nodered_catalog_url: "http://127.0.0.1:1880/multiflexi-catalog"
# Base URL of the MultiFlexi web image endpoints used by the catalog node
multiflexi_server_nodered_app_url: /multiflexi/
# Seed a flow containing a multiflexi-catalog node (overwrites flows.json)
multiflexi_server_nodered_seed_flow: true
# Node-RED editor login (adminAuth). A demo user is created so the editor is not
# left wide open. Set the user to "" to leave node-red's own adminAuth untouched.
# The password is supplied as a bcrypt hash (node-red format) so no passlib is
# needed on the control node. Default hash below is for the password "demo".
# Generate your own with: node-red-admin hash-pw  (or: htpasswd -nBC 12 "" | tr -d ':\n')
multiflexi_server_nodered_admin_user: demo
multiflexi_server_nodered_admin_password_hash: "$2b$12$d96b41ded2b5c4e108e23OlAK3OF8IXom3oF7/pcwix2k7jVErPZK"
multiflexi_server_nodered_admin_permissions: "*"  # "*" = full access, "read" = read-only

# Database connection defaults (override in inventory; do not commit secrets)
multiflexi_db_host: localhost
multiflexi_db_port: 3306
multiflexi_db_name: multiflexi
multiflexi_db_user: multiflexi
multiflexi_db_password: null

# Extra packages to install (e.g. multiflexi-scheduler, multiflexi-executor, multiflexi-eventor)
multiflexi_extra_packages: []

# Repository configuration
multiflexi_repository_channel: testing
multiflexi_repositories:
  testing:
    repo_url: http://repo.vitexsoftware.com
    gpg_key: http://repo.vitexsoftware.com/KEY.gpg
  stable:
    repo_url: https://repo.multiflexi.eu
    gpg_key: https://repo.multiflexi.eu/KEY.gpg

# APT components per channel (stable repo has no backports component)
multiflexi_repository_components:
  testing: "main backports"
  stable: "main"

# VaultWarden integration.
# When multiflexi_vaultwarden_enabled is true the role installs
# multiflexi-vaultwarden (and optionally multiflexi-vaultwarden-ui) from the
# VitexSoftware APT repository, and optionally deploys the vaultwarden server
# itself plus the bw CLI tool.
multiflexi_vaultwarden_enabled: false

# Install the MultiFlexi web UI component (credential form helper).
multiflexi_vaultwarden_install_ui: true

# Deploy the vaultwarden server package (requires a package source that
# provides "vaultwarden" to be available in APT, e.g. from the vaultwarden
# project's own repository).
multiflexi_vaultwarden_install_server: false

# Install the vaultwarden web-vault static files package ("vaultwarden-web").
# Only relevant when multiflexi_vaultwarden_install_server is true.
multiflexi_vaultwarden_install_web: true

# Install the bw-cli package (Bitwarden CLI) from the VitexSoftware APT repository.
multiflexi_vaultwarden_install_bwcli: false

# URL MultiFlexi uses to reach the vaultwarden API.
# Written to /etc/multiflexi/multiflexi.env as VAULTWARDEN_URL.
# Leave empty to skip writing the env var (manual credential setup).
multiflexi_vaultwarden_url: >-
  {{ 'http://127.0.0.1:' ~ multiflexi_vaultwarden_server_port ~ '/'
     if multiflexi_vaultwarden_install_server | bool
     else '' }}

# vaultwarden server settings (only used when install_server is true).
multiflexi_vaultwarden_server_port: 8080
multiflexi_vaultwarden_server_data_dir: /var/lib/vaultwarden
multiflexi_vaultwarden_server_web_vault_dir: /usr/share/vaultwarden/web-vault
# DOMAIN must be the externally reachable URL (used for invitation links etc.)
multiflexi_vaultwarden_server_domain: "http://{{ ansible_fqdn }}:{{ multiflexi_vaultwarden_server_port }}"
# Admin panel token — leave empty to disable the admin panel.
multiflexi_vaultwarden_server_admin_token: ""
multiflexi_vaultwarden_server_signups_allowed: true
multiflexi_vaultwarden_server_log_level: warn
